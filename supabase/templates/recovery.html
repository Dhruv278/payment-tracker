<!doctype html>
<html>
  <body style="margin:0;background:#eef1f5;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;color:#14213d">
    <div style="max-width:560px;margin:32px auto;padding:0 16px">
      <div style="background:#ffffff;border:1px solid #d9dee7;border-radius:12px;padding:32px">
        <h1 style="font-size:20px;line-height:1.3;margin:0 0 16px">Reset your password</h1>
        <p style="font-size:15px;line-height:1.6;margin:0 0 10px;color:#2b3a5c">
          Someone asked to reset the password for this account. Use the button below to choose a new one. The link works on any device and expires in an hour.
        </p>
        <p style="margin:24px 0 0">
          <a
            href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
            style="display:inline-block;background:#14213d;color:#ffffff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px"
            >Choose a new password</a
          >
        </p>
      </div>
      <p style="font-size:12px;line-height:1.5;color:#646e80;margin:16px 0 0">If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
    </div>
  </body>
</html>
